<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <!-- Definir gradientes e filtros de brilho -->
  <defs>
    <linearGradient id="appleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle de fundo com gradiente escuro e contorno verde sutil -->
  <rect x="16" y="16" width="480" height="480" rx="110" fill="url(#bgGrad)" stroke="rgba(16, 185, 129, 0.15)" stroke-width="8" />

  <!-- Anel base dos Macronutrientes -->
  <circle cx="256" cy="256" r="170" stroke="rgba(255, 255, 255, 0.04)" stroke-width="12" fill="none" />
  
  <!-- Arcos dos macronutrientes da AppCal -->
  <!-- Hidratos de Carbono (Azul) -->
  <path d="M 136 360 A 170 170 0 0 1 100 256" stroke="#3b82f6" stroke-width="16" stroke-linecap="round" fill="none" />
  
  <!-- Proteína (Rosa) -->
  <path d="M 115 190 A 170 170 0 0 1 200 102" stroke="#f43f5e" stroke-width="16" stroke-linecap="round" fill="none" />
  
  <!-- Lípidos (Laranja) -->
  <path d="M 256 86 A 170 170 0 0 1 376 136" stroke="#f59e0b" stroke-width="16" stroke-linecap="round" fill="none" />

  <!-- Calorias Totais (Verde Esmeralda principal com brilho) -->
  <path d="M 400 210 A 170 170 0 0 1 360 376" stroke="url(#appleGrad)" stroke-width="20" stroke-linecap="round" fill="none" filter="url(#glow)" />

  <!-- Ícone central da Maçã com Folha -->
  <g filter="url(#glow)" transform="translate(6, -4)">
    <path d="M 250 190 
             C 214 190, 184 216, 184 258 
             C 184 316, 220 350, 250 350 
             C 280 350, 316 316, 316 258 
             C 316 216, 286 190, 250 190 Z" 
          fill="url(#appleGrad)" />
    
    <!-- Folha da Maçã -->
    <path d="M 250 190 
             C 250 160, 274 146, 294 146 
             C 294 170, 274 190, 250 190 Z" 
          fill="url(#leafGrad)" />
  </g>
</svg>